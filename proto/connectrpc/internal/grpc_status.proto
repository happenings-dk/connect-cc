syntax = "proto3";

package connectrpc.internal_wire;

import "google/protobuf/any.proto";

// Wire-compatible with google.rpc.Status. Kept private to the implementation
// to avoid requiring or defining the application's google.rpc message classes.
message GrpcStatus {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
