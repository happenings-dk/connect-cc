syntax = "proto3";

package connectrpc.internal_wire;

option optimize_for = LITE_RUNTIME;

// Wire-compatible with google.protobuf.Any without a full-runtime dependency.
message AnyDetail {
  string type_url = 1;
  bytes value = 2;
}

// Wire-compatible with google.rpc.Status. Kept private to the implementation
// to avoid requiring or defining the application's google.rpc message classes.
message GrpcStatus {
  int32 code = 1;
  string message = 2;
  repeated AnyDetail details = 3;
}
