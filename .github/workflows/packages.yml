name: Packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        manager: [vcpkg, conan]
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      CONAN_HOME: ${{ github.workspace }}/build/.conan-home
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: matrix.manager == 'vcpkg'
        with:
          repository: microsoft/vcpkg
          ref: 3d22b64585ca026e881728fd87e541c23a611a43
          path: .ci-vcpkg
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.manager == 'conan'
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.manager == 'conan'
        with:
          python-version: '3.12'
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake pkg-config autoconf automake libtool bison gperf nasm
          mkdir -p build
      - name: Verify vcpkg package
        if: matrix.manager == 'vcpkg'
        run: |
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ci/run-vcpkg-package.sh 2>&1 | tee build/vcpkg-package.log
      - name: Verify Conan package and protocol matrix
        if: matrix.manager == 'conan'
        run: |
          python -m pip install conan==2.34.0 pylint==4.1.3
          pylint --max-line-length=80 conanfile.py test_package/conanfile.py
          ci/run-conan-package.sh 2>&1 | tee build/conan-package.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.manager }}
          path: |
            build/*package.log
            build-conan-matrix/Testing/Temporary/*.log
            .ci-vcpkg/buildtrees/connectcpp/*.log
          retention-days: 14
