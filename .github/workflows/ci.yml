name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Compiler lane to verify
        type: choice
        default: all
        options: [all, windows, macos, linux-gcc, linux-clang, linux-arm64, asan-ubsan, tsan]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      config: ${{ steps.select.outputs.config }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select compiler lanes
        id: select
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          config=$(jq -ce --arg platform "$PLATFORM" \
            '{include: [.[] | select($platform == "all" or .name == $platform)]} | select(.include | length > 0)' \
            .github/ci-matrix.json)
          echo "config=$config" >> "$GITHUB_OUTPUT"
  verify:
    needs: matrix
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.config) }}
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '3'
      CTEST_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: microsoft/vcpkg
          ref: 3d22b64585ca026e881728fd87e541c23a611a43
          path: .ci-vcpkg
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Prepare dependency cache
        id: cache-environment
        run: |
          cache_path="$RUNNER_TEMP/vcpkg-archives"
          mkdir -p "$cache_path"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache_path" >> "$GITHUB_ENV"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore compiled dependencies
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-v1-${{ matrix.name }}-${{ steps.cache-environment.outputs.image }}-${{ hashFiles('vcpkg.json', 'ci/triplets/**', 'ci/toolchains/**') }}
          restore-keys: |
            vcpkg-v1-${{ matrix.name }}-${{ steps.cache-environment.outputs.image }}-
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18 libclang-rt-18-dev llvm-18 autoconf automake libtool bison gperf nasm
      - name: Bootstrap pinned package manager
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            .ci-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
      - name: Configure
        id: configure
        env:
          COMPILER: ${{ matrix.compiler }}
          TRIPLET: ${{ matrix.triplet }}
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          flags=()
          if [[ "$SANITIZER" == address ]]; then
            flags+=(-DCONNECTCPP_SANITIZE=ON)
          elif [[ "$SANITIZER" == thread ]]; then
            flags+=(-DCONNECTCPP_THREAD_SANITIZE=ON)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" -DVCPKG_HOST_TRIPLET="${TRIPLET%%-?san}" \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build \
            -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE=Release \
            -DCONNECTCPP_BUILD_CONFORMANCE=ON "${flags[@]}"
      - name: Build and test full protocol matrix
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --output-junit results.xml
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          test -z "$(gofmt -l cmd internal)"
      - name: Installed package consumers
        env:
          COMPILER: ${{ matrix.compiler }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          cmake --install build --prefix "$PWD/install"
          for example in consumer callbacks headers; do
            cmake -S "examples/$example" -B "build-$example" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_INSTALL=OFF \
              -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
              -DVCPKG_TARGET_TRIPLET="$TRIPLET" -DVCPKG_HOST_TRIPLET="${TRIPLET%%-?san}" \
              -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
              -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$PWD/install"
            cmake --build "build-$example" --parallel 3
            if [[ "$example" == headers ]]; then continue; fi
            executable="build-$example/$example"
            if [[ "$RUNNER_OS" == Windows ]]; then executable+='.exe'; fi
            "$executable"
          done
      - name: Lite-only runtime and installed consumer
        env:
          COMPILER: ${{ matrix.compiler }}
          TRIPLET: ${{ matrix.triplet }}
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          flags=()
          if [[ "$SANITIZER" == address ]]; then
            flags+=(-DCONNECTCPP_SANITIZE=ON)
          elif [[ "$SANITIZER" == thread ]]; then
            flags+=(-DCONNECTCPP_THREAD_SANITIZE=ON)
          fi
          cmake -S . -B build-lite -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" -DVCPKG_HOST_TRIPLET="${TRIPLET%%-?san}" \
            -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE=Release \
            -DCONNECTCPP_PROTOBUF_LITE=ON "${flags[@]}"
          cmake --build build-lite --parallel 3
          ctest --test-dir build-lite --output-on-failure --output-junit results.xml
          cmake --install build-lite --prefix "$PWD/install-lite"
          cmake -S examples/lite -B build-lite-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" -DVCPKG_HOST_TRIPLET="${TRIPLET%%-?san}" \
            -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-lite"
          cmake --build build-lite-consumer --parallel 3 --verbose > build-lite/consumer-build.log 2>&1
          executable=build-lite-consumer/lite
          if [[ "$RUNNER_OS" == Windows ]]; then executable+='.exe'; fi
          "$executable"
          if [[ "$RUNNER_OS" != Windows ]]; then
            nm -C "$executable" > build-lite/symbols.txt
            if grep -E 'google::protobuf::(DescriptorPool|Reflection|Message::)' build-lite/symbols.txt; then
              echo 'Full Protobuf symbols in Lite consumer' >&2
              exit 1
            fi
          fi
      - name: Native system trust online probe
        if: matrix.sanitizer == 'none'
        env:
          COMPILER: ${{ matrix.compiler }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          cmake -S examples/native-trust -B build-native-trust -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" -DVCPKG_HOST_TRIPLET="${TRIPLET%%-?san}" \
            -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-native-trust --parallel 3
          executable=build-native-trust/native-trust
          if [[ "$RUNNER_OS" == Windows ]]; then executable+='.exe'; fi
          "$executable" https://connectrpc.com
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.name }}
          path: |
            build-lite/Testing/Temporary/*.log
            build-lite/results.xml
            build-lite/consumer-build.log
            build-lite/symbols.txt
            build/Testing/Temporary/*.log
            build/results.xml
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
      - name: Save compiled dependencies
        if: always() && steps.configure.outcome == 'success' && steps.dependency-cache.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
  fuzz:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: microsoft/vcpkg
          ref: 3d22b64585ca026e881728fd87e541c23a611a43
          path: .ci-vcpkg
      - name: Build fuzz target
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18 libclang-rt-18-dev llvm-18 autoconf automake libtool bison gperf nasm
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-asan -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF -DCONNECTCPP_BUILD_GENERATOR=OFF \
            -DCONNECTCPP_BUILD_FUZZERS=ON -DCONNECTCPP_SANITIZE=ON
          cmake --build build-fuzz --parallel 3
      - name: Fuzz protocol parsers
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/artifacts
          cp fuzz/corpus/* build-fuzz/corpus/
          build-fuzz/connectcpp_protocol_fuzz build-fuzz/corpus \
            -max_total_time=120 -max_len=4096 -timeout=10 -rss_limit_mb=1024 \
            -artifact_prefix=build-fuzz/artifacts/ 2>&1 | tee build-fuzz/fuzz.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-evidence
          path: |
            build-fuzz/fuzz.log
            build-fuzz/artifacts/
            build-fuzz/corpus/
          retention-days: 14
