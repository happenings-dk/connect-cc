# HTTP/1.1 Connect and gRPC-Web. Native gRPC and bidi require HTTP/2.
# Eligible Connect GET is enabled. No skips or known failures.
features:
  versions: [HTTP_VERSION_1]
  protocols: [PROTOCOL_CONNECT, PROTOCOL_GRPC_WEB]
  codecs: [CODEC_PROTO, CODEC_JSON]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  streamTypes: [STREAM_TYPE_UNARY, STREAM_TYPE_SERVER_STREAM, STREAM_TYPE_CLIENT_STREAM]
  supportsH2c: false
  supportsTls: true
  supportsTlsClientCerts: true
  supportsConnectGet: true
  supportsMessageReceiveLimit: true
